name: upstream-watch

# Weekly read-only nudge: is there anything worth cherry-picking from upstream
# (rdavydov)? Runs scripts/check-upstream.sh and, if so, opens/updates a tracking
# ISSUE on THIS repo. It deliberately cannot touch upstream:
#   * no `pull-requests` permission is granted, and
#   * the github-script step acts only on `context.repo` (this fork).
# Integration is always a manual cherry-pick + PR against this fork — never a
# merge, never a PR to upstream. See scripts/check-upstream.sh for the why.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git cherry needs full history

      - name: Check upstream for pullable commits
        id: check
        shell: bash
        run: |
          set +e
          ./scripts/check-upstream.sh --porcelain > /tmp/up_porcelain.txt 2>/tmp/up_err.txt
          rc=$?
          ./scripts/check-upstream.sh > /tmp/up_report.txt 2>&1
          if [ $rc -ne 0 ]; then
            echo "check-upstream.sh failed (rc=$rc):"; cat /tmp/up_err.txt
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(grep -c . /tmp/up_porcelain.txt 2>/dev/null || echo 0)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Found $n pullable upstream commit(s)."

      - name: Open or update tracking issue
        if: steps.check.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/up_report.txt', 'utf8');
            const { owner, repo } = context.repo;   // THIS fork only — never upstream
            const title = '⬆️ Upstream fixes available to cherry-pick';
            const body = [
              'Automated by `.github/workflows/upstream-watch.yml`.',
              '',
              'Upstream (`rdavydov`) has commits with no patch-equivalent in this fork.',
              'Cherry-pick the relevant ones onto a branch here and open a PR against',
              '`master` of **this** repo. Never merge the whole upstream tree, and never',
              'open a PR to upstream.',
              '',
              '```',
              report.trim(),
              '```',
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const found = existing.find(i => i.title === title && !i.pull_request);

            if (found) {
              await github.rest.issues.update({ owner, repo, issue_number: found.number, body });
              await github.rest.issues.createComment({
                owner, repo, issue_number: found.number,
                body: 'Refreshed — upstream still has pullable commits (see updated issue body).',
              });
              core.info(`Updated issue #${found.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Created issue #${created.data.number}`);
            }
