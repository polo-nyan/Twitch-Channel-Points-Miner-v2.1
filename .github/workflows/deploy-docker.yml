name: deploy-docker

on:
  push:
    # branches: [master]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-docker:
    name: Deploy Docker Hub
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Login to DockerHub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: polo-nyan/Twitch-Channel-Points-Miner-v2.1
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags') }}
            type=raw,value=latest

      - name: Build and push AMD64, ARM64, ARMv7
        id: docker_build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: BUILDX_QEMU_ENV=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # File size exceeds the maximum allowed 25000 bytes
      # - name: Docker Hub Description
      #   uses: peter-evans/dockerhub-description@v2
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_TOKEN }}
      #     repository: rdavidoff/twitch-channel-points-miner-v2

      - name: Image digest AMD64, ARM64, ARMv7
        run: echo ${{ steps.docker_build.outputs.digest }}
