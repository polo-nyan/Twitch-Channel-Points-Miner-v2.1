services:
  miner:
    #image: rdavidoff/twitch-channel-points-miner-v2
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      - TERM=xterm-256color
      # Gates the dashboard's state-changing endpoints (/api/config/save can
      # write an executable run.py). Left empty here on purpose — set the real
      # value in the deployment's own environment, never in this file.
      - ANALYTICS_TOKEN=${ANALYTICS_TOKEN:-}
      # How often to re-check Twitch's persisted-query hashes. 0 disables.
      - GQL_REFRESH_HOURS=${GQL_REFRESH_HOURS:-12}
      # IRC chat uses TLS on 6697. 1 = fall back to plaintext 6667 (WARNING
      # in the log) when the first TLS connection fails. Off by default.
      - TCPM_IRC_PLAINTEXT_FALLBACK=${TCPM_IRC_PLAINTEXT_FALLBACK:-0}
      # Reward choice in multi-day channel drop campaigns (classes/DropLanes.py):
      # off | dry-run (log only) | on. Optional preference list of reward names.
      - TCPM_DROP_LANE_SWITCH=${TCPM_DROP_LANE_SWITCH:-off}
      - TCPM_DROP_LANE_PREFERENCE=${TCPM_DROP_LANE_PREFERENCE:-}
      # Watch reward-choice channels ahead of game-drop streams: on | off.
      # Empty = on only when TCPM_DROP_LANE_SWITCH=on.
      - TCPM_DROP_LANE_PRIORITY=${TCPM_DROP_LANE_PRIORITY:-}
      # Real HLS segment downloads for drop progress (classes/HLSFetcher.py):
      # off | minute (one 160p segment every 30-60 s) | head-all (HEAD every
      # segment, every 15-25 s) | continuous (not yet). Intervals are random.
      - TCPM_HLS_SEGMENT_FETCH=${TCPM_HLS_SEGMENT_FETCH:-off}
      - TCPM_HLS_DAILY_BUDGET_MB=${TCPM_HLS_DAILY_BUDGET_MB:-300}
      - TCPM_HLS_SEGMENT_CHANNELS=${TCPM_HLS_SEGMENT_CHANNELS:-}
      # Free watch-time badges on not-followed channels (classes/FreeBadges.py):
      # off | on. One at a time, then a random 2.5-5 day cooldown.
      - TCPM_FREE_BADGES=${TCPM_FREE_BADGES:-off}
      # Separate weekend timer (10-25 h) inside a weekly window, local time.
      - TCPM_FREE_BADGES_WEEKEND=${TCPM_FREE_BADGES_WEEKEND:-off}
      - TCPM_FREE_BADGES_WEEKEND_WINDOW=${TCPM_FREE_BADGES_WEEKEND_WINDOW:-fri 18:00-sun 22:00}
      - TCPM_FREE_BADGES_WEEKEND_TZ=${TCPM_FREE_BADGES_WEEKEND_TZ:-Europe/Berlin}
    volumes:
     # - './data/analytics:/usr/src/app/analytics'
     # - './data/cookies:/usr/src/app/cookies'
     # - './data/logs:/usr/src/app/logs'
     # - './settings.json:/usr/src/app/settings.json'
     # - './run.py:/usr/src/app/run.py:ro'
      - data:/usr/src/app/analytics
      - data:/usr/src/app/cookies
      - logs:/usr/src/app/logs
      - settings:/usr/src/app/settings
      # Healed GQL hashes. Derived state, so losing it is harmless — but keeping
      # it across redeploys saves a probe round on every start.
      - cache:/usr/src/app/cache
    #ports:    
    #  - '5005:5005'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  data:
  logs:
  settings:
  cache: